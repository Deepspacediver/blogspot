services:
  blogspot:
    build:
      context: ../../
      dockerfile: Dockerfile.dev
    ports:
      - "3005:3005"
    env_file:
      - ../../.env
    networks:
      - blogspot-net
    volumes:
      - ../../:/app/
      - /app/node_modules
      - /app/.next
  blogspot-db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - blogspot-db-dev-data:/var/lib/postgresql/data
      - ../../src/db/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - blogspot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 5s
  db-checker:
    image: postgres:16-alpine
    restart: "no"
    networks:
      - blogspot-net
    depends_on:
      blogspot-db:
        condition: service_healthy
    env_file:
      - ../../.env
    command: >
      sh -c "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql --no-password -h blogspot-db -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1;' && echo 'CONNECTION SUCCESSFUL'"

networks:
  blogspot-net:
    external: true

volumes:
  blogspot-db-dev-data:
    external: true
